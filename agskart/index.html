  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 clamp(17px,1.5vw,20px)/1.25 'Sora',sans-serif;color:#0B1F2A;letter-spacing:-.015em;margin-top:13px\">Free-look<\u002Fdiv>\n          <p style=\"font:400 14px/1.65 'Plus Jakarta Sans',sans-serif;color:#4A6472;margin:11px 0 0;text-wrap:pretty\">Read the wording at home. If it is not what you were told, cancel it and get your money back.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position:relative;padding-top:38px\">\n          <span style=\"position:absolute;top:0;left:0;width:15px;height:15px;border-radius:50%;background:#3F7F2E;border:3px solid #F6FAFC;box-shadow:0 0 0 1px rgba(63,127,46,.35);display:block\"><\u002Fspan>\n          <div style=\"font:700 11.5px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.14em;color:#33661F\">04<\u002Fdiv>\n          <div style=\"font:700 clamp(17px,1.5vw,20px)/1.25 'Sora',sans-serif;color:#0B1F2A;letter-spacing:-.015em;margin-top:13px\">Cover active<\u002Fdiv>\n          <p style=\"font:400 14px/1.65 'Plus Jakarta Sans',sans-serif;color:#4A6472;margin:11px 0 0;text-wrap:pretty\">Claim any time while the policy runs. You call us, and we file it.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position:relative;padding-top:38px\">\n          <span style=\"position:absolute;top:0;left:0;width:15px;height:15px;border-radius:50%;background:#1D6B99;border:3px solid #F6FAFC;box-shadow:0 0 0 1px rgba(29,107,153,.35);display:block\"><\u002Fspan>\n          <div style=\"font:700 11.5px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.14em;color:#1D6B99\">05<\u002Fdiv>\n          <div style=\"font:700 clamp(17px,1.5vw,20px)/1.25 'Sora',sans-serif;color:#0B1F2A;letter-spacing:-.015em;margin-top:13px\">Renewal<\u002Fdiv>\n          <p style=\"font:400 14px/1.65 'Plus Jakarta Sans',sans-serif;color:#4A6472;margin:11px 0 0;text-wrap:pretty\">We remind you before it lapses, and re-check the market in case something better exists.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n< ims helpline<\u002Fdiv>\n        <div style=\"font:700 26px/1 'Sora',sans-serif;color:#fff;margin-top:12px;letter-spacing:-.02em\">+91 00000 00000<\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#4A6472;max-width:280px\">Say it is a claim and you will be put through to the advisor already holding your file.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#1D6B99;padding:74px 0 76px\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:0 32px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:44px;flex-wrap:wrap;margin-bottom:14px\">\n      <h2 style=\"font:700 clamp(28px,3.4vw,44px)/1.04 'Sora',sans-serif;letter-spacing:-.026em;margin:0;color:#fff;max-width:520px;text-wrap:balance\">What to do first<\u002Fh2>\n      <p style=\"font:400 16.5px/1.6 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.9);margin:0;max-width:380px;text-wrap:pretty\">The order matters. Calling us first is what keeps a claim from being rejected on a technicality.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"position:relative;margin:12px 0 46px\">\n      <div style=\"position:absolute;top:6px;left:6.5px;right:calc((100% - 3 * clamp(16px,2vw,28px)) / 4 - 6.5px);height:1px;background:rgba(255,255,255,.35)\"><\u002Fdiv>\n      <div style=\"position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,2vw,28px)\">\n        <div style=\"position:relative;padding-top:34px\">\n          <span style=\"position:absolute;top:0;left:0;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(29,107,153,1),0 0 0 5px rgba(255,255,255,.45);display:block\"><\u002Fspan>\n          <div style=\"font:700 15.5px/1.3 'Sora',sans-serif;color:#fff;letter-spacing:-.012em\">Call us<\u002Fdiv>\n          <div style=\"font:500 12.5px/1.4 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.9);margin-top:7px\">Same day<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative;padding-top:34px\">\n          <span style=\"position:absolute;top:0;left:0;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(29,107,153,1),0 0 0 5px rgba(255,255,255,.45);display:block\"><\u002Fspan>\n          <div style=\"font:700 15.5px/1.3 'Sora',sans-serif;color:#fff;letter-spacing:-.012em\">Pre-authorisation<\u002Fdiv>\n          <div style=\"font:500 12.5px/1.4 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.9);margin-top:7px\">Cashless network<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative;padding-top:34px\">\n          <span style=\"position:absolute;top:0;left:0;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(29,107,153,1),0 0 0 5px rgba(255,255,255,.45);display:block\"><\u002Fspan>\n          <div style=\"font:700 15.5px/1.3 'Sora',sans-serif;color:#fff;letter-spacing:-.012em\">File review<\u002Fdiv>\n          <div style=\"font:500 12.5px/1.4 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.9);margin-top:7px\">Against insurer checklist<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative;padding-top:34px\">\n          <span style=\"position:absolute;top:0;left:0;width:13px;height:13px;border-radius:50%;background:#61BB48;box-shadow:0 0 0 4px rgba(29,107,153,1),0 0 0 5px rgba(255,255,255,.45);display:block\"><\u002Fspan>\n          <div style=\"font:700 15.5px/1.3 'Sora',sans-serif;color:#fff;letter-spacing:-.012em\">Settlement<\u002Fdiv>\n          <div style=\"font:500 12.5px/1.4 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.9);margin-top:7px\">One contact until paid<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:52px minmax(0,232px) minmax(0,1fr);gap:26px;align-items:center;padding:26px 0;border-top:1px solid rgba(255,255,255,.24)\">\n      <span style=\"font:700 13px/1 'Sora',sans-serif;color:rgba(255,255,255,.86)\">01<\u002Fspan>\n      <span style=\"font:700 clamp(21px,1.9vw,28px)/1.12 'Sora',sans-serif;color:#fff;letter-spacing:-.018em\">Submit Your Details<\u002Fspan>\n      <span style=\"font:400 15px/1.55 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.9)\">Fill out our simple enquiry form describing your claim issue. We only need basic policy details to start our review process immediately.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:52px minmax(0,232px) minmax(0,1fr);gap:26px;align-items:center;padding:26px 0;border-top:1px solid rgba(255,255,255,.24)\">\n      <span style=\"font:700 13px/1 'Sora',sans-serif;color:rgba(255,255,255,.86)\">02<\u002Fspan>\n      <span style=\"font:700 clamp(21px,1.9vw,28px)/1.12 'Sora',sans-serif;color:#fff;letter-spacing:-.018em\">Expert Claim Review<\u002Fspan>\n      <span style=\"font:400 15px/1.55 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.9)\">Our specialised claims desk analyses your documentation and identifies the hurdles preventing a successful pursual with your insurer.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:52px minmax(0,232px) minmax(0,1fr);gap:26px;align-items:center;padding:26px 0;border-top:1px solid rgba(255,255,255,.24);border-bottom:1px solid rgba(255,255,255,.24)\">\n      <span style=\"font:700 13px/1 'Sora',sans-serif;color:rgba(255,255,255,.86)\">03<\u002Fspan>\n      <span style=\"font:700 clamp(21px,1.9vw,28px)/1.12 'Sora',sans-serif;color:#fff;letter-spacing:-.018em\">Final Claim Resolution<\u002Fspan>\n      <span style=\"font:400 15px/1.55 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.9)\">We act as your advocate, coordinating directly with the insurance provider to ensure your claim is processed fairly and settled promptly.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#F8F5EF;padding:74px 0;border-top:1px solid rgba(11,31,42,.07)\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:0 32px\">\n    <div style=\"max-width:600px\">\n      <div style=\"font:700 12px/1 'Plus Jakarta Sans',sans-serif;color:#3F7F2E;letter-spacing:.12em;text-transform:uppercase\">Before you call<\u002Fdiv>\n      <h2 style=\"font:700 clamp(26px,3vw,38px)/1.14 'Sora',sans-serif;letter-spacing:-.022em;margin:14px 0 0;color:#0B1F2A;text-wrap:balance\">What to have to hand<\u002Fh2>\n      <p style=\"font:400 16px/1.7 'Plus Jakarta Sans',sans-serif;color:#4A6472;margin:16px 0 0;text-wrap:pretty\">Nothing here is mandatory to start a claim. It just makes the first call shorter.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);margin-top:40px\">\n      <div>\n        <div style=\"font:700 15px/1.3 'Sora',sans-serif;color:#0B1F2A;padding-bottom:16px;border-bottom:1px solid rgba(11,31,42,.16)\">Health claims<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#0B1F2A;padding:16px 0;border-bottom:1px solid rgba(11,31,42,.10)\">Policy number and the insured person's name<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#0B1F2A;padding:16px 0;border-bottom:1px solid rgba(11,31,42,.10)\">Hospital name and city<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#0B1F2A;padding:16px 0;border-bottom:1px solid rgba(11,31,42,.10)\">The doctor's diagnosis, in whatever words you have<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#0B1F2A;padding:16px 0;border-bottom:1px solid rgba(11,31,42,.10)\">Date of admission, or the planned date<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#0B1F2A;padding:16px 0;border-bottom:1px solid rgba(11,31,42,.10)\">Whether the condition was declared when you bought the policy<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:700 15px/1.3 'Sora',sans-serif;color:#0B1F2A;padding-bottom:16px;border-bottom:1px solid rgba(11,31,42,.16)\">Motor claims<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#0B1F2A;padding:16px 0;border-bottom:1px solid rgba(11,31,42,.10)\">Policy number and vehicle registration number<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#0B1F2A;padding:16px 0;border-bottom:1px solid rgba(11,31,42,.10)\">Where and when it happened<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#0B1F2A;padding:16px 0;border-bottom:1px solid rgba(11,31,42,.10)\">Photographs of the damage, if it is safe to take them<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#0B1F2A;padding:16px 0;border-bottom:1px solid rgba(11,31,42,.10)\">Whether anyone was injured, and whether police were involved<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 'Plus Jakarta Sans',sans-serif;color:#0B1F2A;padding:16px 0;border-bottom:1px solid rgba(11,31,42,.10)\">Driving licence of whoever was driving<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#0B1F2A;padding:78px 0\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(32px,4.5vw,72px);align-items:start\">\n    <div>\n      <div style=\"font:700 12px/1 'Plus Jakarta Sans',sans-serif;color:#61BB48;letter-spacing:.12em;text-transform:uppercase\">If a claim is refused<\u002Fdiv>\n      <h2 style=\"font:700 clamp(26px,3vw,40px)/1.12 'Sora',sans-serif;letter-spacing:-.024em;margin:16px 0 0;color:#fff;text-wrap:balance\">A refusal is not the end of it<\u002Fh2>\n      <p style=\"font:400 16px/1.7 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.72);margin:18px 0 0;max-width:420px;text-wrap:pretty\">Insurers have a formal grievance process, and above that sits the Insurance Ombudsman. Both are free to use. We handle the paperwork for both on your behalf.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"display:flex;gap:22px;padding:22px 0;border-top:1px solid rgba(255,255,255,.18)\">\n        <span style=\"font:700 12px/1 'Sora',sans-serif;color:#61BB48;flex:none;padding-top:4px;width:28px\">01<\u002Fspan>\n        <div>\n          <div style=\"font:700 16.5px/1.35 'Plus Jakarta Sans',sans-serif;color:#fff\">We ask for the reason in writing<\u002Fdiv>\n          <p style=\"font:400 14.5px/1.65 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.72);margin:7px 0 0\">An insurer has to state its grounds. Often the stated ground is something we can answer with one more document.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:22px;padding:22px 0;border-top:1px solid rgba(255,255,255,.18)\">\n        <span style=\"font:700 12px/1 'Sora',sans-serif;color:#61BB48;flex:none;padding-top:4px;width:28px\">02<\u002Fspan>\n        <div>\n          <div style=\"font:700 16.5px/1.35 'Plus Jakarta Sans',sans-serif;color:#fff\">We file with the insurer's grievance officer<\u002Fdiv>\n          <p style=\"font:400 14.5px/1.65 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.72);margin:7px 0 0\">Every insurer is required to have one, and to respond within the timeline set by the regulator.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:22px;padding:22px 0;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18)\">\n        <span style=\"font:700 12px/1 'Sora',sans-serif;color:#61BB48;flex:none;padding-top:4px;width:28px\">03<\u002Fspan>\n        <div>\n          <div style=\"font:700 16.5px/1.35 'Plus Jakarta Sans',sans-serif;color:#fff\">We escalate to the Ombudsman<\u002Fdiv>\n          <p style=\"font:400 14.5px/1.65 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.72);margin:7px 0 0\">If the grievance route does not resolve it, the Ombudsman hears the case at no cost to you. We prepare and submit the file.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#fff;padding:0 0 74px\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:0 32px\">\n    <div style=\"margin-top:74px;border-radius:26px;background:linear-gradient(115deg,#1D6B99 0%,#155A82 52%,#3F7F2E 100%);padding:56px 60px;display:flex;align-items:center;justify-content:space-between;gap:44px;flex-wrap:wrap\">\n      <div style=\"max-width:560px\">\n        <h2 style=\"font:700 clamp(24px,2.8vw,34px)/1.16 'Sora',sans-serif;letter-spacing:-.022em;margin:0;color:#fff;text-wrap:balance\">Not sure whether something is claimable?<\u002Fh2>\n        <p style=\"font:400 16px/1.7 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.9);margin:14px 0 0\">Ask before you spend. A two-minute call is cheaper than a rejected claim.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;flex:none\">\n        <a href=\"#contact\" style=\"display:flex;align-items:center;justify-content:center;background:#fff;color:#0B1F2A;font:700 15.5px/1 'Plus Jakarta Sans',sans-serif;padding:19px 34px;border-radius:12px;white-space:nowrap\" style-hover=\"background:#0B1F2A;color:#fff\">Ask an advisor<\u002Fa>\n        <div style=\"text-align:center;font:600 14px/1 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.9)\">or call +91 00000 00000<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:#0B1F2A;padding:52px 0 0\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:0 32px\">\n    <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:48px;flex-wrap:wrap;padding-bottom:36px;border-bottom:1px solid rgba(255,255,255,.12)\">\n      <div>\n        <div style=\"background:#fff;border-rad
